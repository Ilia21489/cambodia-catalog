<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:640px;height:360px;overflow:hidden;background:#14161c}

.strip{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}

.text{position:absolute;left:40px;top:50%;transform:translateY(-50%);max-width:340px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#d8b97c;font-weight:600;margin:0 0 12px}
h1{font-size:40px;line-height:1.05;margin:0 0 12px;font-weight:700;letter-spacing:-.01em}
p{margin:0;font-size:16px;color:rgba(255,255,255,.8);line-height:1.4}
